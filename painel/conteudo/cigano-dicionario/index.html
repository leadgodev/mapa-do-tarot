const list = document.getElementById('combinacoes-list');
const searchInput = document.getElementById('search-input');

function renderCombinacoes(combos) {
  list.innerHTML = '';
  combos.forEach(c => {
    const div = document.createElement('div');
    div.className = 'combinacao-item';
    div.innerHTML = `
      <div class="combo-num">#${c.id}</div>
      <div class="combo-cartas">${c.cartas}</div>
      <div class="combo-desc">${c.desc}</div>
    `;
    list.appendChild(div);
  });
}

searchInput.addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const filtered = COMBINACOES.filter(c =>
    c.cartas.toLowerCase().includes(q) ||
    c.desc.toLowerCase().includes(q)
  );
  renderCombinacoes(filtered);
});

renderCombinacoes(COMBINACOES);
